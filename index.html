                            <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنمي العائلة - Neon Cinema</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08090c;
            --card-bg: #10141d;
            --neon-blue: #00d2ff;
            --neon-glow: rgba(0, 210, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(8, 9, 12, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 210, 255, 0.15);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: radial-gradient(circle, #00d2ff 0%, #0055ff 100%);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px var(--neon-glow);
            font-size: 1.2rem;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 900;
            background: linear-gradient(90deg, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--neon-blue);
            display: none;
        }

        .auth-btn {
            background: transparent;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
            transition: 0.3s;
        }

        .auth-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* Hero Banner */
        .hero {
            position: relative;
            height: 200px;
            margin: 15px 20px;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(to top, rgba(8,9,12,0.95), rgba(8,9,12,0.2)), url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000') center/cover;
            display: flex;
            align-items: flex-end;
            padding: 20px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.1);
        }

        .hero-content h2 {
            font-size: 1.4rem;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .hero-content p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Search & Categories */
        .search-box {
            padding: 0 20px;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 18px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px var(--neon-glow);
        }

        /* View Filters */
        .view-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 0 20px;
        }

        .tab-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--neon-blue);
            color: #000;
            font-weight: 700;
            border-color: var(--neon-blue);
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 20px 15px 20px;
            scrollbar-width: none;
        }

        .chip {
            background: var(--card-bg);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .chip.active, .chip:hover {
            background: var(--neon-blue);
            color: #000;
            font-weight: 700;
            box-shadow: 0 0 15px var(--neon-glow);
        }

        /* Anime Grid */
        .section-title {
            padding: 0 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--neon-blue);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--neon-blue);
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            padding: 0 20px;
        }

        .anime-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
            position: relative;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 5px 20px var(--neon-glow);
        }

        .poster-container {
            width: 100%;
            height: 180px;
            position: relative;
        }

        .poster-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .episodes-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: var(--neon-blue);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            border: 1px solid var(--neon-blue);
            backdrop-filter: blur(4px);
        }

        .card-info {
            padding: 10px;
        }

        .anime-title {
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .anime-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* Detail Modal */
        .full-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 200;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-header-bg {
            width: 100%;
            height: 250px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .modal-overlay {
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, var(--bg-color), transparent);
            display: flex;
            align-items: flex-start;
            padding: 20px;
        }

        .close-btn {
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: 1px solid var(--neon-blue);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .details-body {
            padding: 0 20px 30px 20px;
            margin-top: -60px;
            position: relative;
        }

        .details-title {
            font-size: 1.6rem;
            font-weight: 900;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin: 12px 0;
        }

        .btn-status {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-status.fav-active {
            background: #ff4757;
            border-color: #ff4757;
            color: #fff;
        }

        .btn-status.watching-active {
            background: #ffa502;
            border-color: #ffa502;
            color: #000;
        }

        .details-tags {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.8rem;
            color: var(--neon-blue);
        }

        .details-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Episode Card */
        .episode-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .ep-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ep-watched-btn {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.3;
            transition: 0.3s;
        }

        .ep-watched-btn.watched {
            opacity: 1;
            filter: drop-shadow(0 0 5px var(--neon-blue));
        }

        .ep-name {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .ep-size {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .ep-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-watch {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .btn-edit {
            background: rgba(255, 165, 0, 0.2);
            color: #ffa502;
            border: 1px solid rgba(255, 165, 0, 0.4);
        }

        .btn-download {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Owner Panel */
        #ownerPanel {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--neon-blue);
            margin: 20px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px var(--neon-glow);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-input {
            padding: 10px;
            background: #08090c;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
        }

        .owner-btn {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        /* Edit Episode Modal (تعديل الحلقة) */
        .edit-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            z-index: 300;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .edit-modal-content {
            background: var(--card-bg);
            border: 1px solid var(--neon-blue);
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-shadow: 0 0 25px var(--neon-glow);
        }
    </style>

<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">🕊️</div>
            <div class="logo-text">أنمي العائلة</div>
        </div>
        <div class="user-nav">
            <img id="userImg" class="user-avatar" src="" alt="User">
            <button id="authBtn" class="auth-btn" onclick="handleAuth()">تسجيل الدخول 🔑</button>
        </div>
    </header>

    <!-- Hero Banner -->
    <div class="hero">
        <div class="hero-content">
            <h2>عالم الأنمي بين يديك</h2>
            <p>شاهد ونزل أحدث الحلقات وتتبع إنجازات مشاهدتك مجاناً.</p>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن أنمي، فيلم، تصنيف..." onkeyup="searchAnime()">
    </div>

    <!-- View Tabs -->
    <div class="view-tabs">
        <button class="tab-btn active" onclick="switchView('all', this)">الكل</button>
        <button class="tab-btn" onclick="switchView('fav', this)">❤️ المفضلات</button>
        <button class="tab-btn" onclick="switchView('watching', this)">⏳ جاري المشاهدة</button>
    </div>

    <!-- Categories -->
    <div class="categories">
        <div class="chip active" onclick="filterCategory('الكل')">الكل</div>
        <div class="chip" onclick="filterCategory('أكشن')">🔥 أكشن</div>
        <div class="chip" onclick="filterCategory('مغامرات')">🧭 مغامرات</div>
        <div class="chip" onclick="filterCategory('رعب')">💀 رعب</div>
        <div class="chip" onclick="filterCategory('غموض')">🔍 غموض</div>
        <div class="chip" onclick="filterCategory('خيال علمي')">⚡ خيال علمي</div>
        <div class="chip" onclick="filterCategory('دراما')">🎭 دراما</div>
        <div class="chip" onclick="filterCategory('كوميديا')">🤣 كوميديا</div>
        <div class="chip" onclick="filterCategory('خيال')">🔮 خيال</div>
        <div class="chip" onclick="filterCategory('رومانسي')">💖 رومانسي</div>
    </div>

    <!-- Owner Control Panel -->
    <div id="ownerPanel">
        <h3 style="color:var(--neon-blue); margin-bottom:12px;">⚙️ لوحة التحكم الملكية</h3>
        <div class="input-group">
            <input type="text" id="animeTitle" class="form-input" placeholder="اسم الأنمي">
            <input type="text" id="animeCat" class="form-input" placeholder="التصنيف (أكشن، غموض، رعب...)">
            <input type="text" id="animeYear" class="form-input" placeholder="سنة الإصدار (2024)">
            <input type="url" id="animePoster" class="form-input" placeholder="رابط صورة البوستر">
            <textarea id="animeDesc" class="form-input" placeholder="قصة الأنمي"></textarea>
            
            <hr style="border-color:rgba(255,255,255,0.1); margin:5px 0;">
            <p style="font-size:0.8rem; color:var(--neon-blue);">تفاصيل الحلقة الأولى:</p>
            <input type="text" id="epTitle" class="form-input" placeholder="رقم الحلقة (مثال: الحلقة 01)">
            <input type="text" id="epSize" class="form-input" placeholder="الحجم (مثال: 180MB)">
            <input type="url" id="epWatchUrl" class="form-input" placeholder="رابط الحلقة (Archive / Telegram)">
        </div>
        <button class="owner-btn" onclick="addAnimeToFirebase()">نشر العمل 🚀</button>
    </div>

    <!-- Main Content Grid -->
    <div class="section-title" id="sectionTitle">الأعمال المتاحة</div>
    <div class="anime-grid" id="animeGrid"></div>

    <!-- Detail Modal -->
    <div id="detailModal" class="full-modal">
        <div class="modal-header-bg" id="modalBg">
            <div class="modal-overlay">
                <button class="close-btn" onclick="closeDetailModal()">✕</button>
            </div>
        </div>
        <div class="details-body">
            <div class="details-title" id="modalTitle">اسم الأنمي</div>
            
            <div class="action-row">
                <button id="favBtn" class="btn-status" onclick="toggleFavorite()">❤️ إضافة للمفضلة</button>
                <button id="watchingBtn" class="btn-status" onclick="toggleWatching()">⏳ جاري المشاهدة</button>
            </div>

            <div class="details-tags">
                <span id="modalCat">التصنيف</span> • 
                <span id="modalYear">السنة</span>
            </div>
