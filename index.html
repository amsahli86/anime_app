<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أنمي العائلة - Neon Cinema</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #08090c;
            --card-bg: #10141d;
            --neon-blue: #00d2ff;
            --neon-glow: rgba(0, 210, 255, 0.4);
            --text-main: #ffffff;
            --text-muted: #8a99ad;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(8, 9, 12, 0.85);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(0, 210, 255, 0.15);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: radial-gradient(circle, #00d2ff 0%, #0055ff 100%);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px var(--neon-glow);
            font-size: 1.2rem;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 900;
            background: linear-gradient(90deg, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--neon-blue);
            display: none;
        }

        .auth-btn {
            background: transparent;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
            transition: 0.3s;
        }

        .auth-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
        }

        /* Hero Banner */
        .hero {
            position: relative;
            height: 200px;
            margin: 15px 20px;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(to top, rgba(8,9,12,0.95), rgba(8,9,12,0.2)), url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1000') center/cover;
            display: flex;
            align-items: flex-end;
            padding: 20px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.1);
        }

        .hero-content h2 {
            font-size: 1.4rem;
            font-weight: 900;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .hero-content p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Search & Categories */
        .search-box {
            padding: 0 20px;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 18px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 12px var(--neon-glow);
        }

        /* View Filters (الكل / المفضلات / جاري المشاهدة) */
        .view-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            padding: 0 20px;
        }

        .tab-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--neon-blue);
            color: #000;
            font-weight: 700;
            border-color: var(--neon-blue);
        }

        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 0 20px 15px 20px;
            scrollbar-width: none;
        }

        .chip {
            background: var(--card-bg);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .chip.active, .chip:hover {
            background: var(--neon-blue);
            color: #000;
            font-weight: 700;
            box-shadow: 0 0 15px var(--neon-glow);
        }

        /* Anime Grid */
        .section-title {
            padding: 0 20px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--neon-blue);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--neon-blue);
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            padding: 0 20px;
        }

        .anime-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
            position: relative;
        }

        .anime-card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-blue);
            box-shadow: 0 5px 20px var(--neon-glow);
        }

        .poster-container {
            width: 100%;
            height: 180px;
            position: relative;
        }

        .poster-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .episodes-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.75);
            color: var(--neon-blue);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            border: 1px solid var(--neon-blue);
            backdrop-filter: blur(4px);
        }

        .card-info {
            padding: 10px;
        }

        .anime-title {
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .anime-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* Detail Modal */
        .full-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 200;
            overflow-y: auto;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-header-bg {
            width: 100%;
            height: 250px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .modal-overlay {
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, var(--bg-color), transparent);
            display: flex;
            align-items: flex-start;
            padding: 20px;
        }

        .close-btn {
            background: rgba(0,0,0,0.6);
            color: #fff;
            border: 1px solid var(--neon-blue);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .details-body {
            padding: 0 20px 30px 20px;
            margin-top: -60px;
            position: relative;
        }

        .details-title {
            font-size: 1.6rem;
            font-weight: 900;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin: 12px 0;
        }

        .btn-status {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-status.fav-active {
            background: #ff4757;
            border-color: #ff4757;
            color: #fff;
        }

        .btn-status.watching-active {
            background: #ffa502;
            border-color: #ffa502;
            color: #000;
        }

        .details-tags {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 0.8rem;
            color: var(--neon-blue);
        }

        .details-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Episode Card */
        .episode-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .ep-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ep-watched-btn {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.3;
            transition: 0.3s;
        }

        .ep-watched-btn.watched {
            opacity: 1;
            filter: drop-shadow(0 0 5px var(--neon-blue));
        }

        .ep-name {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .ep-size {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .ep-actions {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-watch {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .btn-download {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Owner Panel */
        #ownerPanel {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--neon-blue);
            margin: 20px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 20px var(--neon-glow);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .form-input {
            padding: 10px;
            background: #08090c;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
        }

        .owner-btn {
            background: var(--neon-blue);
            color: #000;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAmhWP8wdACdpYz1RbmfR2pDYTG5bguwM8",
          authDomain: "animeapp-6533b.firebaseapp.com",
          projectId: "animeapp-6533b",
          storageBucket: "animeapp-6533b.firebasestorage.app",
          messagingSenderId: "295896760420",
          appId: "1:295896760420:web:9cf2852bece9d4b3415f71",
          measurementId: "G-88DSZP0NZZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.auth = auth;
        window.db = db;
        window.provider = provider;
        window.signInWithPopup = signInWithPopup;
        window.signOut = signOut;
        window.onAuthStateChanged = onAuthStateChanged;
        window.collection = collection;
        window.addDoc = addDoc;
        window.onSnapshot = onSnapshot;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.setDoc = setDoc;
        window.getDoc = getDoc;
    </script>
</head>
<body>

    <header>
        <div class="logo-container">
            <div class="logo-icon">🕊️</div>
            <div class="logo-text">أنمي العائلة</div>
        </div>
        <div class="user-nav">
            <img id="userImg" class="user-avatar" src="" alt="User">
            <button id="authBtn" class="auth-btn" onclick="handleAuth()">تسجيل الدخول 🔑</button>
        </div>
    </header>

    <!-- Hero Banner -->
    <div class="hero">
        <div class="hero-content">
            <h2>عالم الأنمي بين يديك</h2>
            <p>شاهد ونزل أحدث الحلقات وتتبع إنجازات مشاهدتك مجاناً.</p>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن أنمي، فيلم، تصنيف..." onkeyup="searchAnime()">
    </div>

    <!-- View Tabs (الكل / المفضلة / جاري المشاهدة) -->
    <div class="view-tabs">
        <button class="tab-btn active" onclick="switchView('all', this)">الكل</button>
        <button class="tab-btn" onclick="switchView('fav', this)">❤️ المفضلات</button>
        <button class="tab-btn" onclick="switchView('watching', this)">⏳ جاري المشاهدة</button>
    </div>

    <!-- Expanded Categories -->
    <div class="categories">
        <div class="chip active" onclick="filterCategory('الكل')">الكل</div>
        <div class="chip" onclick="filterCategory('أكشن')">🔥 أكشن</div>
        <div class="chip" onclick="filterCategory('مغامرات')">🧭 مغامرات</div>
        <div class="chip" onclick="filterCategory('رعب')">💀 رعب</div>
        <div class="chip" onclick="filterCategory('غموض')">🔍 غموض</div>
        <div class="chip" onclick="filterCategory('خيال علمي')">⚡ خيال علمي</div>
        <div class="chip" onclick="filterCategory('دراما')">🎭 دراما</div>
        <div class="chip" onclick="filterCategory('كوميديا')">🤣 كوميديا</div>
        <div class="chip" onclick="filterCategory('خيال')">🔮 خيال</div>
        <div class="chip" onclick="filterCategory('رومانسي')">💖 رومانسي</div>
    </div>

    <!-- Owner Control Panel -->
    <div id="ownerPanel">
        <h3 style="color:var(--neon-blue); margin-bottom:12px;">⚙️ لوحة التحكم الملكية</h3>
        <div class="input-group">
            <input type="text" id="animeTitle" class="form-input" placeholder="اسم الأنمي">
            <input type="text" id="animeCat" class="form-input" placeholder="التصنيف (أكشن، غموض، رعب...)">
            <input type="text" id="animeYear" class="form-input" placeholder="سنة الإصدار (2024)">
            <input type="url" id="animePoster" class="form-input" placeholder="رابط صورة البوستر">
            <textarea id="animeDesc" class="form-input" placeholder="قصة الأنمي"></textarea>
            
            <hr style="border-color:rgba(255,255,255,0.1); margin:5px 0;">
            <p style="font-size:0.8rem; color:var(--neon-blue);">تفاصيل الحلقة الأولى:</p>
            <input type="text" id="epTitle" class="form-input" placeholder="رقم الحلقة (مثال: الحلقة 01)">
            <input type="text" id="epSize" class="form-input" placeholder="الحجم (مثال: 180MB)">
            <input type="url" id="epWatchUrl" class="form-input" placeholder="رابط الحلقة (Archive / Telegram)">
        </div>
        <button class="owner-btn" onclick="addAnimeToFirebase()">نشر العمل 🚀</button>
    </div>

    <!-- Main Content Grid -->
    <div class="section-title" id="sectionTitle">الأعمال المتاحة</div>
    <div class="anime-grid" id="animeGrid"></div>

    <!-- Detail Modal -->
    <div id="detailModal" class="full-modal">
        <div class="modal-header-bg" id="modalBg">
            <div class="modal-overlay">
                <button class="close-btn" onclick="closeDetailModal()">✕</button>
            </div>
        </div>
        <div class="details-body">
            <div class="details-title" id="modalTitle">اسم الأنمي</div>
            
            <div class="action-row">
                <button id="favBtn" class="btn-status" onclick="toggleFavorite()">❤️ إضافة للمفضلة</button>
                <button id="watchingBtn" class="btn-status" onclick="toggleWatching()">⏳ جاري المشاهدة</button>
            </div>

            <div class="details-tags">
                <span id="modalCat">التصنيف</span> • 
                <span id="modalYear">السنة</span>
            </div>
            <div class="details-desc" id="modalDesc">قصة الأنمي...</div>

            <div class="episodes-title" style="font-weight:700; margin-bottom:10px;">قائمة الحلقات 🎬</div>
            <div id="episodesList"></div>

            <button id="deleteAnimeBtn" class="owner-btn" style="background:#ff3f34; color:#fff; width:100%; margin-top:20px; display:none;">حذف هذا العمل نهائياً 🗑️</button>
        </div>
    </div>

    <script>
        const OWNER_EMAIL = "amsahli86@gmail.com";
        let currentUser = null;
        let userData = { favorites: [], watching: [], watchedEpisodes: {} };
        let globalAnimeList = [];
        let activeCategory = 'الكل';
        let currentView = 'all';
        let currentSelectedAnime = null;

        // Initialize Auth listener
        window.addEventListener('load', () => {
            const checkReady = setInterval(() => {
                if (window.auth && window.db) {
                    clearInterval(checkReady);
                    
                    window.onAuthStateChanged(window.auth, async (user) => {
                        currentUser = user;
                        if (user) {
                            document.getElementById('authBtn').innerText = "خروج 🚪";
                            document.getElementById('userImg').src = user.photoURL || "https://via.placeholder.com/32";
                            document.getElementById('userImg').style.display = "block";
                            
                            // Check if Owner
                            if(user.email === OWNER_EMAIL) {
                                document.getElementById('ownerPanel').style.display = 'block';
                            } else {
                                document.getElementById('ownerPanel').style.display = 'none';
                            }

                            // Sync User Saved Data
                            await loadUserData();
                        } else {
                            document.getElementById('authBtn').innerText = "تسجيل الدخول 🔑";
                            document.getElementById('userImg').style.display = "none";
                            document.getElementById('ownerPanel').style.display = 'none';
                            userData = { favorites: [], watching: [], watchedEpisodes: {} };
                        }
                        renderGrid(globalAnimeList);
                    });

                    // Sync Animes
                    window.onSnapshot(window.collection(window.db, "animes"), (snapshot) => {
                        globalAnimeList = [];
                        snapshot.forEach((doc) => {
                            globalAnimeList.push({ id: doc.id, ...doc.data() });
                        });
                        renderGrid(globalAnimeList);
                    });
                }
            }, 300);
        });

        // Google Authentication Handle
        async function handleAuth() {
            if (currentUser) {
                if(confirm("هل تريد تسجيل الخروج؟")) {
                    await window.signOut(window.auth);
                }
            } else {
                try {
                    await window.signInWithPopup(window.auth, window.provider);
                } catch (e) {
                    alert("تعذر تسجيل الدخول: " + e.message);
                }
            }
        }

        // Fetch User Saved State from Firestore
        async function loadUserData() {
            if(!currentUser) return;
            const ref = window.doc(window.db, "users", currentUser.uid);
            const snap = await window.getDoc(ref);
            if(snap.exists()) {
                userData = snap.data();
                if(!userData.favorites) userData.favorites = [];
                if(!userData.watching) userData.watching = [];
                if(!userData.watchedEpisodes) userData.watchedEpisodes = {};
            }
        }

        async function saveUserData() {
            if(!currentUser) return;
            await window.setDoc(window.doc(window.db, "users", currentUser.uid), userData, { merge: true });
        }

        // Add Anime
        async function addAnimeToFirebase() {
            const title = document.getElementById('animeTitle').value.trim();
            const category = document.getElementById('animeCat').value.trim() || "عام";
            const year = document.getElementById('animeYear').value.trim() || "2024";
            const poster = document.getElementById('animePoster').value.trim() || "https://via.placeholder.com/300x400?text=Anime";
            const desc = document.getElementById('animeDesc').value.trim() || "لا توجد قصة متاحة.";

            const epTitle = document.getElementById('epTitle').value.trim() || "الحلقة 01";
            const epSize = document.getElementById('epSize').value.trim() || "150MB";
            const epUrl = document.getElementById('epWatchUrl').value.trim() || "#";

            if (!title) return alert("يرجى كتابة اسم العمل!");

            const episodes = [{ title: epTitle, size: epSize, url: epUrl }];

            try {
                await window.addDoc(window.collection(window.db, "animes"), {
                    title, category, year, poster, desc, episodes, createdAt: Date.now()
                });
                alert("تم نشر العمل بنجاح!");
                document.getElementById('animeTitle').value = "";
                document.getElementById('animePoster').value = "";
            } catch(e) {
                alert("خطأ أثناء الإضافة: " + e.message);
            }
        }

        // Render Grid with User Saved States
        function renderGrid(list) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = "";

            let filtered = list;

            // View Tabs Filter
            if(currentView === 'fav') {
                filtered = filtered.filter(i => userData.favorites.includes(i.id));
            } else if(currentView === 'watching') {
                filtered = filtered.filter(i => userData.watching.includes(i.id));
            }

            // Category Filter
            if(activeCategory !== 'الكل') {
                filtered = filtered.filter(i => i.category.includes(activeCategory));
            }

            if(filtered.length === 0) {
                grid.innerHTML = '<p style="color:var(--text-muted); grid-column:1/-1; text-align:center; padding:30px;">لا توجد أعمال لعرضها.</p>';
                return;
            }

            filtered.forEach(item => {
                const epCount = item.episodes ? item.episodes.length : 1;
                const card = document.createElement('div');
                card.className = 'anime-card';
                card.onclick = () => openDetailModal(item);
                card.innerHTML = `
                    <div class="poster-container">
                        <img src="${item.poster}" alt="${item.title}">
                        <div class="episodes-badge">${epCount} حلقة</div>
                    </div>
                    <div class="card-info">
                        <div class="anime-title">${item.title}</div>
                        <div class="anime-meta">
                            <span>${item.category}</span>
                            <span>${item.year}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Modal Logic
        function openDetailModal(anime) {
            currentSelectedAnime = anime;
            document.getElementById('modalBg').style.backgroundImage = `url('${anime.poster}')`;
            document.getElementById('modalTitle').innerText = anime.title;
            document.getElementById('modalCat').innerText = anime.category;
            document.getElementById('modalYear').innerText = anime.year;
            document.getElementById('modalDesc').innerText = anime.desc;

            updateStatusButtons();
            renderEpisodesList();

            const delBtn = document.getElementById('deleteAnimeBtn');
            if(currentUser && currentUser.email === OWNER_EMAIL) {
                delBtn.style.display = 'block';
                delBtn.onclick = () => deleteAnime(anime.id);
            } else {
                delBtn.style.display = 'none';
            }

            document.getElementById('detailModal').style.display = 'block';
        }

        function renderEpisodesList() {
            const epContainer = document.getElementById('episodesList');
            epContainer.innerHTML = "";

            const animeId = currentSelectedAnime.id;
            const watchedList = userData.watchedEpisodes[animeId] || [];

            if(currentSelectedAnime.episodes && currentSelectedAnime.episodes.length > 0) {
                currentSelectedAnime.episodes.forEach((ep, index) => {
                    const isWatched = watchedList.includes(index);
                    const epCard = document.createElement('div');
                    epCard.className = 'episode-card';
                    epCard.innerHTML = `
                        <div class="ep-info">
                            <button class="ep-watched-btn ${isWatched ? 'watched' : ''}" onclick="toggleWatched(${index})">👁️</button>
                            <div>
                                <div class="ep-name">${ep.title}</div>
                                <div class="ep-size">💾 ${ep.size}</div>
                            </div>
                        </div>
                        <div class="ep-actions">
                            <a href="${ep.url}" target="_blank" class="btn-action btn-watch">مشاهدة</a>
                            <a href="${ep.url}" target="_blank" class="btn-action btn-download">تنزيل</a>
                        </div>
                    `;
                    epContainer.appendChild(epCard);
                });
            } else {
                epContainer.innerHTML = '<p style="color:var(--text-muted)">لا توجد حلقات مضافة بعد.</p>';
            }
        }

        async function toggleWatched(epIndex) {
            if(!currentUser) return alert("يرجى تسجيل الدخول أولاً لتتبع الحلقات المشاهدة!");
            
            const animeId = currentSelectedAnime.id;
            if(!userData.watchedEpisodes[animeId]) userData.watchedEpisodes[animeId] = [];

            const idx = userData.watchedEpisodes[animeId].indexOf(epIndex);
            if(idx > -1) {
                userData.watchedEpisodes[animeId].splice(idx, 1);
            } else {
                userData.watchedEpisodes[animeId].push(epIndex);
            }

            renderEpisodesList();
            await saveUserData();
        }

        async function toggleFavorite() {
            if(!currentUser) return alert("سجل دخولك بحساب Google أولاً!");
            const id = currentSelectedAnime.id;
            const idx = userData.favorites.indexOf(id);
            if(idx > -1) {
                userData.favorites.splice(idx, 1);
            } else {
                userData.favorites.push(id);
            }
            updateStatusButtons();
            await saveUserData();
            renderGrid(globalAnimeList);
        }

        async function toggleWatching() {
            if(!currentUser) return alert("سجل دخولك بحساب Google أولاً!");
            const id = currentSelectedAnime.id;
            const idx = userData.watching.indexOf(id);
            if(idx > -1) {
                userData.watching.splice(idx, 1);
            } else {
                userData.watching.push(id);
            }
            updateStatusButtons();
            await saveUserData();
            renderGrid(globalAnimeList);
        }

        function updateStatusButtons() {
            const id = currentSelectedAnime.id;
            const favBtn = document.getElementById('favBtn');
            const watchingBtn = document.getElementById('watchingBtn');

            if(userData.favorites.includes(id)) {
                favBtn.className = "btn-status fav-active";
                favBtn.innerText = "❤️ في المفضلة";
            } else {
                favBtn.className = "btn-status";
                favBtn.innerText = "🤍 إضافة للمفضلة";
            }

            if(userData.watching.includes(id)) {
                watchingBtn.className = "btn-status watching-active";
                watchingBtn.innerText = "⏳ جاري مشاهدته";
            } else {
                watchingBtn.className = "btn-status";
                watchingBtn.innerText = "➕ جاري المشاهدة";
            }
        }

        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        async function deleteAnime(id) {
            if(confirm("هل أنت تأكد من حذف هذا العمل نهائياً؟")) {
                await window.deleteDoc(window.doc(window.db, "animes", id));
                closeDetailModal();
            }
        }

        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.chip').forEach(c => {
                c.classList.toggle('active', c.innerText.includes(cat) || (cat==='الكل' && c.innerText==='الكل'));
            });
            renderGrid(globalAnimeList);
        }

        function switchView(view, btn) {
            currentView = view;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            const titles = { all: "الأعمال المتاحة", fav: "قائمة المفضلة ❤️", watching: "أنميات قيد المشاهدة ⏳" };
            document.getElementById('sectionTitle').innerText = titles[view];
            
            renderGrid(globalAnimeList);
        }

        function searchAnime() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const results = globalAnimeList.filter(i => i.title.toLowerCase().includes(q) || i.category.toLowerCase().includes(q));
            renderGrid(results);
        }
    </script>
</body>
</html>
